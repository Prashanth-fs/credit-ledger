spring.application.name=credit-ledger

# Secrets (DB url, username, password, JWT secret) are NOT stored here.
# They live in application-local.properties, which is ignored by Git.
# Copy application-local.properties.example to application-local.properties and fill it in.
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
